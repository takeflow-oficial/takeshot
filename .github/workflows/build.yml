# Lint and tests on Windows, macOS and Linux and, with `package`, the seven installers as
# artifacts. ci.yml runs it on pull requests, release.yml before publishing a release and
# release-macos.yml for the dmg alone (`targets`, `checks: false`, `ref`).
name: build

on:
  workflow_call:
    inputs:
      package:
        description: Build the installers too
        type: boolean
        default: false
      checks:
        description: Run fmt, clippy and the tests
        type: boolean
        default: true
      targets:
        description: JSON list of the {name, os} pairs to build on
        type: string
        default: '[{"name":"windows-x64","os":"windows-latest"},{"name":"macos-universal","os":"macos-latest"},{"name":"linux-x64","os":"ubuntu-24.04"}]'
      ref:
        description: Commit to build (empty is the caller's own)
        type: string
        default: ''

env:
  # rust-toolchain.toml pins the MSVC toolchain for local Windows builds; CI uses plain stable.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  PACKAGER_VERSION: 0.11.8

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          if [ "${{ runner.os }}" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin --toolchain stable; fi

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libgtk-3-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgbm-dev libgl1-mesa-dev file

      - uses: Swatinem/rust-cache@v2

      # bash stops at the first failing command; the Windows default (pwsh) only checks the last one.
      - name: Lint and test
        if: inputs.checks
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (Windows / Linux)
        if: inputs.package && runner.os != 'macOS'
        run: cargo build --release

      - name: Build (macOS universal)
        if: inputs.package && runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/takeshot \
            target/aarch64-apple-darwin/release/takeshot target/x86_64-apple-darwin/release/takeshot

      - name: cargo-packager (cached)
        if: inputs.package
        id: packager
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-${{ env.PACKAGER_VERSION }}-${{ runner.os }}

      - name: cargo-packager (install)
        if: inputs.package && steps.packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version ${{ env.PACKAGER_VERSION }} --locked

      # Code signing is off until the repository has the variable and the secrets. Windows: set the
      # variable SIGN_WINDOWS=true and the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
      # AZURE_CLIENT_SECRET, SIGNING_ENDPOINT, SIGNING_ACCOUNT and SIGNING_PROFILE (Azure Artifact
      # Signing). macOS: SIGN_MACOS=true and APPLE_CERTIFICATE (base64 .p12),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific)
      # and APPLE_TEAM_ID.
      - name: Sign the program (Windows)
        if: inputs.package && runner.os == 'Windows' && vars.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Import the signing certificate (macOS)
        if: inputs.package && runner.os == 'macOS' && vars.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Package
        if: inputs.package
        shell: bash
        env:
          # linuxdeploy (AppImage) runs without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
          SIGN_MACOS: ${{ vars.SIGN_MACOS }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              cargo packager --release --formats nsis,wix
              cp target/packages/*-setup.exe "dist/takeshot-$VERSION-windows-x64-setup.exe"
              cp target/packages/*.msi "dist/takeshot-$VERSION-windows-x64.msi"
              mkdir -p portable
              cp target/release/takeshot.exe portable/Takeshot.exe
              cp LICENSE THIRD_PARTY_NOTICES.md portable/
              (cd portable && 7z a "../dist/takeshot-$VERSION-windows-x64-portable.zip" .)
              ;;
            macOS)
              # The packager reads target/release (it ignores --binaries-dir with Cargo.toml's
              # config): the universal binary goes there.
              mkdir -p target/release
              cp target/universal/release/takeshot target/release/takeshot
              cargo packager --release --formats app
              APP=target/packages/Takeshot.app
              lipo "$APP/Contents/MacOS/takeshot" -verify_arch arm64 x86_64
              if [ "$SIGN_MACOS" = "true" ]; then
                codesign --force --deep --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "$APP"
              else
                # Ad hoc: Apple Silicon runs nothing unsigned; Gatekeeper still asks the first time.
                codesign --force --deep -s - "$APP"
              fi
              mkdir -p dmg
              cp -R "$APP" dmg/
              DMG="dist/takeshot-$VERSION-macos-universal.dmg"
              # The window of the design's "Instalador" page: the background (1x and 2x in one TIFF), Takeshot and
              # Applications at fixed places, the arrow between them.
              tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png -out dmg-background.tiff
              brew install create-dmg > /dev/null
              if ! create-dmg --volname Takeshot --background dmg-background.tiff --window-size 660 400                   --icon-size 128 --icon Takeshot.app 165 190 --hide-extension Takeshot.app                   --app-drop-link 495 190 "$DMG" dmg/; then
                # A plain window rather than no release: create-dmg drives Finder, which can fail.
                echo "::warning::create-dmg failed; the dmg falls back to a plain window"
                rm -f "$DMG"
                ln -s /Applications dmg/Applications
                # hdiutil now and then fails with "Resource busy" on the runners.
                for try in 1 2 3; do
                  hdiutil create -volname Takeshot -srcfolder dmg -ov -format UDZO "$DMG" && break
                  sleep 10
                done
              fi
              test -f "$DMG"
              ;;
            Linux)
              cargo packager --release --formats deb,appimage
              cp target/packages/*.deb "dist/takeshot-$VERSION-linux-x86_64.deb"
              cp target/packages/*.AppImage "dist/takeshot-$VERSION-linux-x86_64.AppImage"
              tar -czf "dist/takeshot-$VERSION-linux-x86_64.tar.gz" -C target/release takeshot -C "$PWD" LICENSE THIRD_PARTY_NOTICES.md
              ;;
          esac
          ls -la dist

      - name: Sign the installers (Windows)
        if: inputs.package && runner.os == 'Windows' && vars.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Notarize (macOS)
        if: inputs.package && runner.os == 'macOS' && vars.SIGN_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: takeshot-${{ matrix.name }}
          path: dist/*

